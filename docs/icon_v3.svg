<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square - fills entire 144x144 -->
  <rect width="144" height="144" rx="28" fill="url(#bg)"/>
  
  <!-- Open book: fills most of the canvas -->
  <path d="M18 18 L72 10 L72 112 L18 120 Z" fill="white" opacity="0.96"/>
  <path d="M126 18 L72 10 L72 112 L126 120 Z" fill="white" opacity="0.88"/>
  
  <!-- Book spine -->
  <line x1="72" y1="10" x2="72" y2="112" stroke="#4F46E5" stroke-width="2.5" opacity="0.5"/>
  
  <!-- Left page: English text - larger, more visible -->
  <text x="28" y="36" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.75">The morning light</text>
  <text x="28" y="49" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.65">shone through the</text>
  <text x="28" y="62" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.6">quiet forest as</text>
  <text x="28" y="75" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.55">birds began to</text>
  <text x="28" y="88" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.5">sing their songs.</text>
  <text x="28" y="101" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#6B7B8D" opacity="0.45">She smiled and</text>
  
  <!-- Right page: Chinese translation - larger, more visible -->
  <text x="80" y="36" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="7.5" fill="#4F46E5" opacity="0.75">晨光穿过寂静的</text>
  <text x="80" y="49" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="7.5" fill="#4F46E5" opacity="0.65">森林，鸟儿开始</text>
  <text x="80" y="62" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="7.5" fill="#4F46E5" opacity="0.6">歌唱。她微笑着，</text>
  <text x="80" y="75" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="7.5" fill="#4F46E5" opacity="0.55">感受着这份宁静。</text>
  
  <!-- App name at bottom - large, bold, centered -->
  <text x="72" y="136" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle" letter-spacing="4">双语书</text>
</svg>
