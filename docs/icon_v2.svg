<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 144" width="144" height="144">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect width="144" height="144" rx="28" fill="url(#bg)"/>
  
  <!-- Open book: left page, right page -->
  <path d="M26 28 L72 20 L72 104 L26 96 Z" fill="white" opacity="0.96"/>
  <path d="M118 28 L72 20 L72 104 L118 96 Z" fill="white" opacity="0.88"/>
  
  <!-- Book spine -->
  <line x1="72" y1="20" x2="72" y2="104" stroke="#4F46E5" stroke-width="2" opacity="0.5"/>
  
  <!-- Left page: English text -->
  <text x="34" y="40" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.7">The morning light</text>
  <text x="34" y="50" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.6">shone through the</text>
  <text x="34" y="60" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.55">quiet forest as</text>
  <text x="34" y="70" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.5">birds began to</text>
  <text x="34" y="80" font-family="Helvetica, Arial, sans-serif" font-size="5.5" fill="#6B7B8D" opacity="0.45">sing their songs.</text>
  
  <!-- Right page: Chinese translation -->
  <text x="80" y="40" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="6" fill="#4F46E5" opacity="0.7">晨光穿过寂静的</text>
  <text x="80" y="50" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="6" fill="#4F46E5" opacity="0.6">森林，鸟儿开始</text>
  <text x="80" y="60" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="6" fill="#4F46E5" opacity="0.55">歌唱。</text>
  
  <!-- App name at bottom -->
  <text x="72" y="126" font-family="PingFang SC, Heiti SC, STHeiti, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle" letter-spacing="3">双语书</text>
</svg>
