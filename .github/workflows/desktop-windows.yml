name: Desktop (Windows)

# M0/M3 of docs/DESKTOP_PLAN.md: run the tests on Windows, freeze the sidecar with PyInstaller,
# smoke-test the frozen build (Chinese paths, Chinese rendering, fake backend) and report its size.
on:
  workflow_dispatch:
  push:
    branches: [desktop-app]
    paths:
      - "booktrans/**"
      - "tests/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements-web.txt -r requirements-dev.txt pyinstaller pywebview keyring
      - name: Tests
        shell: bash
        run: |
          python -m pytest -q -rf --tb=short -W ignore::DeprecationWarning 2>&1 | tee test.txt
      - name: Test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" test.txt | head -40 | cut -c1-300 | while read -r l; do echo "::error title=pytest::$l"; done
          tail -n 3 test.txt | cut -c1-300 | while read -r l; do echo "::error title=pytest summary::$l"; done
      - name: Build app
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name BookTranslator \
            --add-data "booktrans/web/static;booktrans/web/static" \
            --collect-submodules uvicorn --collect-submodules booktrans --collect-submodules webview \
            --hidden-import fitz --hidden-import keyring.backends.Windows --hidden-import clr \
            --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy \
            --exclude-module pytest --exclude-module IPython \
            packaging/app_entry.py 2>&1 | tee build.txt
      - name: Smoke test the frozen app (as its own sidecar)
        shell: bash
        run: |
          python packaging/smoke_test.py --bundle dist/BookTranslator \
            dist/BookTranslator/BookTranslator.exe --sidecar 2>&1 | tee smoke.txt
          { echo "### Desktop app (Windows)"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Shell key flow and orphan check
        shell: bash
        run: |
          export BOOKTRANS_SIDECAR="$PWD/dist/BookTranslator/BookTranslator.exe"
          export BOOKTRANS_FAKE_BACKEND=1
          python -m booktrans.desktop.shell --headless-check 2>&1 | tee shell.txt
          python packaging/orphan_test.py python -m booktrans.desktop.shell 2>&1 | tee -a shell.txt
      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DAppVersion=0.1.${{ github.run_number }}" packaging/installer.iss 2>&1 | tee installer-build.txt
          ls -l installer
      - name: Install, smoke test, launch, uninstall
        shell: bash
        run: |
          python packaging/install_check.py installer/BookTranslator-Setup-*.exe 2>&1 | tee install.txt
          { echo "### Installer"; echo '```'; cat install.txt; ls -l installer | tail -n +2; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and smoke failures as annotations
        if: failure()
        shell: bash
        run: |
          # one annotation per log file (GitHub shows at most 10 per step); newest steps first
          for f in install.txt installer-build.txt shell.txt smoke.txt build.txt; do
            if [ -f "$f" ]; then
              msg=$(tail -n 25 "$f" | tr -d '\r' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
              echo "::error title=$f::$msg"
            fi
          done
      - name: Largest folders in the bundle
        shell: bash
        run: |
          { echo "Top folders in dist/BookTranslator/_internal:"; echo '```';
            du -sm dist/BookTranslator/_internal/* | sort -rn | head -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: BookTranslator-Setup
          path: installer/*.exe
          retention-days: 14
