name: Desktop (Windows)

# M0/M3 of docs/DESKTOP_PLAN.md: run the tests on Windows, freeze the sidecar with PyInstaller,
# smoke-test the frozen build (Chinese paths, Chinese rendering, fake backend) and report its size.
on:
  workflow_dispatch:
  push:
    branches: [desktop-app]
    paths:
      - "booktrans/**"
      - "tests/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements-web.txt -r requirements-dev.txt pyinstaller
      - name: Tests
        shell: bash
        run: |
          python -m pytest -q -rf --tb=short -W ignore::DeprecationWarning 2>&1 | tee test.txt
      - name: Test failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E "^(FAILED|ERROR)" test.txt | head -40 | cut -c1-300 | while read -r l; do echo "::error title=pytest::$l"; done
          tail -n 3 test.txt | cut -c1-300 | while read -r l; do echo "::error title=pytest summary::$l"; done
      - name: Build sidecar
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --name booktrans-sidecar \
            --add-data "booktrans/web/static;booktrans/web/static" \
            --collect-submodules uvicorn --collect-submodules booktrans \
            --hidden-import fitz \
            --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy \
            --exclude-module pytest --exclude-module IPython \
            packaging/sidecar_entry.py 2>&1 | tee build.txt
      - name: Smoke test the frozen build
        shell: bash
        run: |
          python packaging/smoke_test.py --bundle dist/booktrans-sidecar \
            dist/booktrans-sidecar/booktrans-sidecar.exe 2>&1 | tee smoke.txt
          { echo "### Desktop sidecar (Windows)"; echo '```'; cat smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Shell prototype (pywebview) - key flow and orphan check
        shell: bash
        run: |
          python -m pip install pywebview keyring
          export BOOKTRANS_SIDECAR="$PWD/dist/booktrans-sidecar/booktrans-sidecar.exe"
          export BOOKTRANS_FAKE_BACKEND=1
          python -m booktrans.desktop.shell --headless-check 2>&1 | tee shell.txt
          python packaging/orphan_test.py python -m booktrans.desktop.shell 2>&1 | tee -a shell.txt
      - name: Build shell prototype
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --onedir --name booktrans-shell \
            --collect-submodules booktrans --collect-submodules webview \
            --hidden-import keyring.backends.Windows --hidden-import clr \
            --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy \
            packaging/shell_entry.py 2>&1 | tee shell-build.txt
          { echo "### Shell prototype (pywebview)"; echo '```';
            python -c "import pathlib;d=pathlib.Path('dist/booktrans-shell');print('shell bundle (without sidecar): %d MB' % (sum(f.stat().st_size for f in d.rglob('*') if f.is_file())/1e6))";
            tail -n 3 shell.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Build and smoke failures as annotations
        if: failure()
        shell: bash
        run: |
          for f in build.txt smoke.txt shell.txt shell-build.txt; do
            [ -f "$f" ] && tail -n 15 "$f" | cut -c1-300 | while read -r l; do echo "::error title=$f::$l"; done
          done
          true
      - name: Largest packages in the bundle
        shell: bash
        run: |
          { echo "Top folders in dist/booktrans-sidecar/_internal:"; echo '```';
            du -sm dist/booktrans-sidecar/_internal/* | sort -rn | head -15; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: booktrans-sidecar-windows
          path: dist/booktrans-sidecar
          retention-days: 7
